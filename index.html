/* ---------- логотип ---------- */
function setLetters(el, text){ el.innerHTML = [...text].map((c,i)=>`<span style="animation-delay:${i*55}ms">${c}</span>`).join(''); }
setLetters(logo, 'BRUKWA');

const wobbleMap = document.getElementById('wobbleMap');
// Safari и все браузеры на iPhone (WebKit) с SVG-фильтром на тексте могут не нарисовать логотип — там эффекты выключены
const NO_SVG_FX = (()=>{ const ua = navigator.userAgent; return /iP(hone|ad|od)/.test(ua) || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR/.test(ua)); })();
function wobble(from, dur){
  if(NO_SVG_FX) return;
  const t0 = performance.now();
  document.querySelectorAll('.logo').forEach(l=>l.classList.add('wob'));
  (function step(t){
    const k = Math.min(1,(t-t0)/dur);
    wobbleMap.setAttribute('scale', (from*(1-k)*(1-k)*Math.abs(Math.sin(k*9)+.35)).toFixed(2));
    if(k<1) requestAnimationFrame(step);
    else { wobbleMap.setAttribute('scale','0'); document.querySelectorAll('.logo').forEach(l=>l.classList.remove('wob')); }
  })(t0);
}
function scramble(el, text, dur=520){
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const t0 = performance.now();
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), fixed = Math.floor(k*text.length);
    el.textContent = [...text].map((c,i)=> i<fixed||c===' ' ? c : abc[Math.random()*abc.length|0]).join('');
    if(k<1) requestAnimationFrame(step);
  })(t0);
  wobble(26, dur+200);
}

/* ---------- рыбий глаз на логотипе ----------
   Круглая линза ездит за курсором. Внутри радиуса R точка берёт картинку из c + (p − c)·(1 − k·(1 − r²)):
   у центра линзы буквы раздуваются, к её краю искажение плавно сходит на нет.
   Карта линзы рисуется один раз, а при движении мыши сдвигается только её позиция. */
const SVGNS = 'http://www.w3.org/2000/svg';
function fisheye(el, id, k){
  if(NO_SVG_FX) return;
  const svg = document.querySelector('svg');
  const f = document.createElementNS(SVGNS, 'filter');
  f.id = id;
  ['filterUnits','primitiveUnits'].forEach(a=>f.setAttribute(a, 'userSpaceOnUse'));
  f.setAttribute('color-interpolation-filters', 'sRGB');
  // нейтральный серый = «без смещения» везде, где линзы нет
  f.innerHTML = `<feFlood flood-color="rgb(128,128,128)" result="zero"/>
    <feImage preserveAspectRatio="none" result="lens"/>
    <feMerge result="map"><feMergeNode in="zero"/><feMergeNode in="lens"/></feMerge>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>`;
  svg.append(f);
  const m = f.querySelector('feImage'), d = f.querySelector('feDisplacementMap');

  let R = 60, S = 0, amt = 0, goal = 0, mx = 0, my = 0, tx = 0, ty = 0, raf = 0;
  function build(){
    const W = el.offsetWidth, H = el.offsetHeight;
    if(!W || !H) return;
    R = H*1.05;
    const n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(n, n);
    S = 2*R*k*.385 + 2;
    for(let y=0; y<n; y++) for(let x=0; x<n; x++){
      const px = ((x+.5)/n*2 - 1)*R, py = ((y+.5)/n*2 - 1)*R;
      const r2 = (px*px + py*py)/(R*R), g = r2 < 1 ? -k*(1 - r2) : 0, o = (y*n + x)*4;
      img.data[o]   = Math.round((.5 + px*g/S)*255);
      img.data[o+1] = Math.round((.5 + py*g/S)*255);
      img.data[o+2] = 128; img.data[o+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    m.setAttribute('href', cv.toDataURL());
    m.setAttribute('width', R*2); m.setAttribute('height', R*2);
    const pad = Math.round(H*.3);
    f.setAttribute('x', -pad); f.setAttribute('y', -pad);
    f.setAttribute('width', W + pad*2); f.setAttribute('height', H + pad*2);
    place();
  }
  function place(){
    m.setAttribute('x', (mx - R).toFixed(1)); m.setAttribute('y', (my - R).toFixed(1));
    d.setAttribute('scale', (S*amt).toFixed(1));
    el.style.filter = amt > .001 ? `url(#${id}) url(#wobble)` : '';
  }
  // линза догоняет курсор с лёгкой задержкой и плавно появляется / исчезает
  function tick(){
    amt += (goal - amt) * .12;
    mx += (tx - mx) * .25; my += (ty - my) * .25;
    place();
    const still = Math.abs(goal-amt) < .003 && Math.abs(tx-mx) < .2 && Math.abs(ty-my) < .2;
    if(still){ amt = goal; mx = tx; my = ty; place(); raf = 0; }
    else raf = requestAnimationFrame(tick);
  }
  const run = ()=>{ if(!raf) raf = requestAnimationFrame(tick); };
  function aim(e, jump){
    const r = el.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
    if(jump){ mx = tx; my = ty; }
  }
  el.addEventListener('mouseenter', e=>{ aim(e, amt < .05); goal = 1; run(); });
  el.addEventListener('mousemove', e=>{ aim(e); run(); });
  el.addEventListener('mouseleave', ()=>{ goal = 0; run(); });
  new ResizeObserver(build).observe(el);
  build();
}

function pvShow(i, instant, dir){
  const list = visible(), intro = i === -1, c = intro ? null : list[i];
  if((!intro && !c) || i === pvIdx || (pvBusy && !instant)) return;
  const fwd = dir || (i > pvIdx ? 1 : -1);
  pvIdx = i;
  const stage = $('#pvStage');
  const old = stage.querySelector('.pv-slide.cur');
  const sl = document.createElement('div');
  if(intro){
    sl.className = 'pv-slide intro'; sl.style.background = 'var(--bg)';
    sl.innerHTML = introHTML();
    sl.querySelector('[data-go]').addEventListener('click', e=>{ e.stopPropagation(); pvStep(1); });
  } else {
    sl.className = 'pv-slide'; sl.style.background = '#0d0d0e'; sl.dataset.i = i;
    sl.innerHTML = `<div class="pv-hero"><div><p class="pv-eyebrow">${eyebrowHTML(i)}</p><h2 class="pv-title">${c.name}</h2></div>${factsHTML(c)}</div>${picHTML(c, i)}`;
  }
  if(c && c.device){
    requestAnimationFrame(()=>placeDevice(sl.querySelector('.pv-pic'), c));
    setTimeout(()=>{ if(pvIdx === i && sl.isConnected && openIdx < 0) goLive(sl, c); }, PV_T + 900);
  }
  const theme = ()=>{
    document.body.classList.toggle('on-intro', intro);
    document.body.classList.toggle('on-work', !intro);      // на проектах у шапки — размытая плашка
  };
  if(instant || !old){
    stage.innerHTML = ''; stage.append(sl);
    requestAnimationFrame(()=>requestAnimationFrame(()=>sl.classList.add('cur')));
    theme();
  } else {
    // кинетика: вперёд новый выезжает снизу и накрывает текущий, а текущий проваливается вглубь —
    // чуть вверх, меньше и темнее; картинка в новом едет медленнее карточки и доезжает с запаздыванием.
    // Назад — зеркально: верхний уезжает вниз, лежащий под ним поднимается из глубины.
    pvBusy = true;
    const T = PV_T, E = PV_EASE;
    const DEEP = 'translateY(-6%) scale(.965)', LAG = 'translateY(-16%) scale(1.12)';
    const pic = el => el.querySelector(':scope > img, :scope > .pv-pic, :scope > .wip-cover, :scope > .intro-in');
    if(fwd > 0){
      sl.style.transform = 'translateY(100%)';
      if(pic(sl)) pic(sl).style.transform = LAG;
      stage.append(sl); old.classList.add('flat');
    } else {
      sl.classList.add('cur', 'dim'); sl.style.transform = DEEP;
      stage.insertBefore(sl, old);
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const go = (el, tf, extra = '')=>{ el.style.transition = `transform ${T}ms ${E}${extra}`; el.style.transform = tf; };
      const picGo = (el, tf)=>{ const im = pic(el); if(im){ im.style.transition = `transform ${T*1.15}ms ${E}`; im.style.transform = tf; } };
      if(fwd > 0){
        go(sl, 'translateY(0)', `, border-radius .45s var(--ease) ${T*.62}ms`); picGo(sl, 'none');
        go(old, DEEP); old.classList.add('dim');
      } else {
        go(old, 'translateY(100%)', ', border-radius .3s var(--ease)'); picGo(old, LAG);
        go(sl, 'none'); requestAnimationFrame(()=>sl.classList.remove('dim'));
      }
      old.classList.remove('cur'); sl.classList.add('cur');
    }));
    setTimeout(theme, PV_T * .3);                          // шапка уезжает / возвращается, плашка появляется
    setTimeout(()=>{ old.remove(); pvBusy = false; }, PV_T + 120);
  }
  requestAnimationFrame(()=>fitTitles(sl));
  const pr = $('#pvProg');
  pr.classList.remove('run'); void pr.offsetWidth;
  if(intro) return;                                        // на первом экране автосмены нет
  const meta = $('#pvMeta');

  meta.classList.remove('roll'); void meta.offsetWidth; meta.classList.add('roll');

  $('#pvThumbs').querySelectorAll('.pv-thumb').forEach(b=>{ const d = Math.abs(+b.dataset.i - i); b.classList.toggle('on', !d); b.classList.toggle('nb', d === 1); });
  // прогресс внизу плашки; когда дойдёт до конца — следующий проект
  if(pvAuto){ pr.style.setProperty('--pvdur', PV_DUR + 'ms'); pr.classList.add('run'); }
  (window.requestIdleCallback || (f=>setTimeout(f, 600)))(()=>preload((i + 1) % list.length));
}

const picHTML = (c, i) => `<div class="pv-pic" data-i="${i}">${

/* экран устройства на обложке: та же математика, что у object-fit: cover — масштаб по большей стороне, центр */
function placeDevice(box0, c){
  const sl = box0;
  const W = sl.clientWidth, H = sl.clientHeight;
  const [iw, ih] = c.device.img, [x, y, w, h] = c.device.rect;
  const k = Math.max(W/iw, H/ih), ox = (W - iw*k)/2, oy = (H - ih*k)/2;
  const box = { left: ox + x*k, top: oy + y*k, width: w*k, height: h*k };
  const dev = sl.querySelector('.pv-device');
  [dev].forEach(el=>Object.assign(el.style, { left: box.left+'px', top: box.top+'px', width: box.width+'px', height: box.height+'px' }));
  // сайт внутри рисуется в ширину 1440 и уменьшается под экран
  const bz = Math.max(2, Math.round(box.width * .006)), inner = box.width - bz*2, vw = 1440;
  dev.style.setProperty('--bz', bz + 'px'); dev.style.setProperty('--dr', Math.round(box.width*.012) + 'px');
  const f = dev.querySelector('iframe');
  if(f){ f.style.width = vw + 'px'; f.style.height = Math.round((box.height - bz*2) * vw / inner) + 'px'; f.style.transform = `scale(${inner / vw})`; }
}
// живой сайт в экране — тяжёлый (свой 3D и анимации), поэтому только на компьютере, только в текущем проекте
// и только когда он постоял на экране; до этого и в кейсе — статичный снимок
const canLive = matchMedia('(hover:hover) and (min-width:761px)').matches;
function goLive(sl, c){
  if(!canLive || !c.device || sl.querySelector('.pv-device iframe')) return;
  const dev = sl.querySelector('.pv-device');
  const f = document.createElement('iframe');
  f.src = c.device.src; f.title = `${c.name} — живой сайт`; f.style.opacity = 0;
  f.addEventListener('load', ()=>{ f.style.transition = 'opacity .6s'; f.style.opacity = 1; });
  dev.prepend(f);
  placeDevice(sl.querySelector('.pv-pic'), c);
}
addEventListener('resize', ()=>{
  document.querySelectorAll('.pv-pic[data-i]').forEach(el=>{
    const c = visible()[+el.dataset.i]; if(c && c.device) placeDevice(el, c);

const pvStep = (sg, auto) => {
  const n = visible().length;
  if(!auto && pvIdx >= 0) stopAuto();
  if(pvIdx === -1){ if(sg > 0) pvShow(0, false, 1); return; }
  if(pvIdx === 0 && sg < 0) return pvShow(-1, false, -1);
  pvShow((pvIdx + sg + n) % n, false, sg);
};

/* надпись «Смотреть» у курсора: над проектом — вместо стрелки, догоняет курсор с лёгкой задержкой */
{
  const tag = $('#ctag');

  const loop = ()=>{ x += (tx - x)*.22; y += (ty - y)*.22; tag.style.left = x + 'px'; tag.style.top = y + 'px';
    raf = (Math.abs(tx - x) > .3 || Math.abs(ty - y) > .3) ? requestAnimationFrame(loop) : 0; };
  addEventListener('mousemove', e=>{
    const over = e.target.closest('#pvStage') && !e.target.closest('.pv-bar, .pv-device') && openIdx < 0 && pvIdx >= 0;
    if(over){

      if(!shown){ x = tx = e.clientX; y = ty = e.clientY; }
    }
    tx = e.clientX; ty = e.clientY;
    if(over !== shown){ shown = over; tag.classList.toggle('on', over); document.body.classList.toggle('ctag-on', over); }
    if(!raf) raf = requestAnimationFrame(loop);
  });
  document.addEventListener('mouseleave', ()=>{ shown = false; tag.classList.remove('on'); document.body.classList.remove('ctag-on'); });

/* ---------- прокрутка, свайпы, клавиши ---------- */
// колесо листает проекты по одному; в открытом кейсе прокрутка вверх возвращает к ленте
let wheelAcc = 0, wheelT = 0, wheelMuteUntil = 0, lastWheel = 0, gestureFromTop = false;
addEventListener('wheel', e=>{
  if(window.lboxOpen && lboxOpen()) return;
  const th = e.target.closest && e.target.closest('.pv-thumbs');
  if(th){ if(th.scrollHeight > th.clientHeight) th.scrollTop += e.deltaY; else th.scrollLeft += e.deltaY + e.deltaX; th.scrollLeft += e.deltaX; return; }
  clearTimeout(wheelT);
  wheelAcc += e.deltaY;
  wheelT = setTimeout(()=>{ wheelAcc = 0; }, 220);
  if(openIdx > -1){
    // закрываем только новым жестом вверх, начатым уже в самом верху: долистала до начала с разгона — кейс остаётся
    const now = performance.now(), fresh = now - lastWheel > 260;
    lastWheel = now;
    if(fresh) gestureFromTop = caseScroll.scrollTop <= 0;
    if(caseScroll.scrollTop > 0) gestureFromTop = false;
    if(!gestureFromTop){ wheelAcc = 0; return; }
    if(wheelAcc < -120){ wheelAcc = 0; closeCase(); wheelMuteUntil = now + 700; }
    return;
  }
  // хвост инерции после закрытия кейса не листает ленту
  if(performance.now() < wheelMuteUntil || pvBusy) return;
  if(Math.abs(wheelAcc) > 60){ pvStep(Math.sign(wheelAcc)); wheelAcc = 0; wheelMuteUntil = performance.now() + PV_T; }
}, { passive:true });
let touchY = null, touchAtTop = false;
addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; touchAtTop = caseScroll.scrollTop <= 0; }, { passive:true });
addEventListener('touchmove', e=>{
  if(touchY === null || openIdx < 0 || !touchAtTop) return;
  // в кейсе свайп вниз тянет его за пальцем; дотянул — закрываем
  const dy = Math.max(0, e.touches[0].clientY - touchY);
  caseEl.style.transition = 'none';
  caseEl.style.transform = `translateY(${(dy*.45).toFixed(1)}px)`;
}, { passive:true });
addEventListener('touchend', e=>{
  if(touchY === null) return;
  const dy = (e.changedTouches[0]?.clientY ?? touchY) - touchY;
  touchY = null;
  if(openIdx > -1){
    caseEl.style.transition = ''; caseEl.style.transform = '';
    if(touchAtTop && dy > 90) closeCase();
    return;
  }
  if(Math.abs(dy) > 60) pvStep(dy < 0 ? 1 : -1);   // свайп вверх — следующий проект
});
addEventListener('keydown', e=>{
  if(window.lboxOpen && lboxOpen()){
    if(e.key === 'Escape') lboxClose();
    if(e.key === 'ArrowRight') lboxStep(1);
    if(e.key === 'ArrowLeft') lboxStep(-1);
    return;
  }
  if(e.key === 'Escape'){ if(works.classList.contains('on')) worksClose(); else closeCase(); return; }
  if(openIdx > -1) return;
  if(e.key === 'Enter' && e.target === document.body) pvOpenCurrent();
  if(e.key === 'ArrowDown' || e.key === 'PageDown') pvStep(1);
  if(e.key === 'ArrowUp' || e.key === 'PageUp') pvStep(-1);
});

// логотип — всегда на главную, к первому экрану: закрывает кейс и возвращает ленту в начало

}

// плитка бенто — одна разметка и для сетки, и для рядов

let TILE_N = 0;

      // размер плитки: c — колонок из 4, r — рядов; старые w/h — то же, что c:2 / r:2
      const cls = [x.c ? 'c' + x.c : x.w ? 'w2' : '', x.r ? 'r' + x.r : x.h ? 'h2' : '', x.cls || ''].join(' ');
      // шапка карточки: подпись слева, номер справа (у решений и списка свой номер — не дублируем)
      const lb = x.step || x.list ? '' : `<span class="th">${x.lb ? `<span class="lb">${x.lb}</span>` : '<span></span>'}<span class="tid"><i>ID</i>${String(++TILE_N).padStart(3, '0')}</span></span>`;
      if(x.img) return `<div class="${cls}">${imgT(x.img, x.pos ? `style="object-position:${x.pos}"` : '')}${lb}</div>`;
      // длинная страница в окне браузера на цветной подложке — листается внутри окна
      // live — вместо картинки встаёт живой сайт (на компьютере), картинка остаётся заглушкой
      if(x.win) return `<div class="${cls} dv" style="--dbg:${x.bg || 'var(--cacc)'}${x.mesh ? `;--m1:${x.mesh[0]};--m2:${x.mesh[1]};--m3:${x.mesh[2]}` : ''}"><div class="bw"><div class="bar"><i></i><i></i><i></i><span>${x.url || ''}</span><em>${L(x.live ? 'Живой сайт — можно листать' : 'Листайте внутри ↓')}</em></div>${
          screenT(x.live ? { shot:x.win, live:x.live } : { src:x.win, long:true }, 1440)}</div>${lb}</div>`;
      // генератор целиком (как у Instrument): снимок инструмента с панелью, сверху слева — название со стрелкой и что он делает
      if(x.gen) return `<div class="${cls} gen">${imgT(x.gen)}<div class="gc"><b>→ ${x.e}</b><span>${x.p}</span></div></div>`;
      // 3D-коробка: крутится сама, тянешь — поворачиваешь

          Object.entries(x.box).map(([k, s])=>`<i class="${k}" style="background-image:url('${s}')"></i>`).join('')}</div></div>${lb}</div>`;
      // шторка «до / после»
      if(x.ba) return `<div class="${cls} b-ba"><div class="cmp" style="--i:${x.k || 0}"><img src="${x.ba[1]}" alt="${L('После')}" loading="lazy"><div class="bf"><img src="${x.ba[0]}" alt="${L('До')}" loading="lazy"></div><i class="hd"></i></div>${lb}</div>`;

      if(x.list) return `<div class="${cls} ls"><i>${x.h || ''}</i><ol>${x.list.map(t=>`<li>${t}</li>`).join('')}</ol></div>`;
      if(x.step) return `<div class="${cls} st"><i>${x.n || ''}</i><b>${x.step[0]}</b><span>${x.step[1]}</span></div>`;
      if(x.pal && Array.isArray(x.pal[0])) return `<div class="${cls} pal named">${x.pal.map(([hex, n, ink])=>`<i style="background:${hex};color:${ink || '#fff'}"><b>${n}</b>${hex}</i>`).join('')}${lb}</div>`;
      if(x.phone) return `<div class="${cls} ph-tile"${x.bg ? ` style="background:${x.bg}"` : ''}><div class="phone">${x.live || x.long
          ? screenT({ shot:x.phone, src:x.phone, live:x.live, long:x.long && !x.live }, 390)
          : `<div class="scr"><img src="${x.phone}" alt="" loading="lazy" style="object-fit:cover;object-position:50% 0"></div>`}</div>${lb}</div>`;
      if(x.book) return `<div class="${cls}"><div class="cube-wrap book-wrap" data-spin><div class="book">${
          Object.entries(x.book).map(([k, s])=>`<i class="${k}" style="background-image:url('${s}')"></i>`).join('')}<i class="pg"></i><i class="tp"></i><i class="bt"></i></div></div>${lb}</div>`;
      if(x.pal) return `<div class="${cls} pal">${x.pal.map(c=>`<i style="background:${c}"></i>`).join('')}${lb}</div>`;
      if(x.words) return `<div class="${cls} tx words${x.acc ? ' acc' : ''}">${x.words.map(w=>`<b>${w}</b>`).join('')}${lb}</div>`;

// кейс без своего набора — общий шаблон
const defaultBlocks = c => [
  { t:'lead', h:'Задача', text:c.line },

// живой сайт в окне браузера / телефоне: подключается, когда до него долистали; только на компьютере
// iframe вне экрана выключаем (display:none — кадры и шейдеры внутри встают), вернулся — включаем без перезагрузки
const frameIO = new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('frame-off', !e.isIntersecting)), { rootMargin:'80px 0px' });
const watchFrames = root => root.querySelectorAll('iframe').forEach(f=>frameIO.observe(f.closest('.pv-device')?.parentElement || f.parentElement));
const liveIO = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting || !canLive) return;
  const el = e.target; liveIO.unobserve(el);
  const f = document.createElement('iframe');
  f.src = el.dataset.live; f.title = 'Живой сайт'; f.loading = 'lazy';
  f.addEventListener('load', ()=>{ f.classList.add('on'); el.classList.add('is-live'); });
  frameIO.observe(el);
  el.append(f); fitLive(el);
}), { rootMargin:'200px 0px' });
function fitLive(el){
  const f = el.querySelector('iframe'); if(!f) return;
  const vw = +el.dataset.vw, k = el.clientWidth / vw;
  f.style.width = vw + 'px'; f.style.height = Math.ceil(el.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`;
}
const liveRO = new ResizeObserver(es=>es.forEach(e=>fitLive(e.target)));

// 3D-коробка и книга: крутятся сами, пока видны; тянешь — поворачиваешь
const spins = new Set();
function spinBox(wrap){
  const obj = wrap.firstElementChild;
  const st = { ry:-28, rx:-14, v:.22, drag:null, seen:false };
  const draw = ()=>{ obj.style.transform = `rotateX(${st.rx}deg) rotateY(${st.ry}deg)`; };
  wrap.addEventListener('pointerdown', e=>{ st.drag = { x:e.clientX, y:e.clientY, ry:st.ry, rx:st.rx }; wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e=>{ if(!st.drag) return;
    st.ry = st.drag.ry + (e.clientX - st.drag.x) * .5;
    st.rx = Math.max(-60, Math.min(60, st.drag.rx - (e.clientY - st.drag.y) * .3)); draw(); });
  const up = ()=>{ st.drag = null; };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  new IntersectionObserver(es=>{ st.seen = es[0].isIntersecting; }).observe(wrap);
  st.tick = ()=>{ if(st.seen && !st.drag && !reduceMotion){ st.ry += st.v; st.rx += (-14 - st.rx) * .02; draw(); } };
  draw(); spins.add(st);
}
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
(function spinLoop(){ if(openIdx > -1) spins.forEach(s=>s.tick()); requestAnimationFrame(spinLoop); })();

function fillCase(i){
  const list = visible(), c = list[i], nx = list[nextOpen(i)];
  // тема кейса: цвета страницы под проект
  const t = c.theme || {};
  const vars = { '--cbg':t.bg, '--ccard':t.card, '--cink':t.ink, '--cmute':t.mute, '--cline':t.line, '--cacc':t.acc, '--cacc-ink':t.accInk };

  $('#caseLead').textContent = c.line;

  $('#caseCover').innerHTML = picHTML(c, i);
  if(c.caseCover){
    const pic = $('#caseCover .pv-pic'); pic.classList.add('rv-cover');

  watchFrames($('#caseCover'));
  $('#next').innerHTML = `${L('Дальше')}<span class="nx-name">: ${nx.name}</span> →`;

  spins.clear(); TILE_N = 0;
  // «Задача», факты и этапы, если идут подряд, собираются в одну карточку
  const blocks = [];
  (c.blocks || defaultBlocks(c)).forEach(b=>{
    const prev = blocks[blocks.length - 1];
    if(b.t === 'kv' && prev && prev.t === 'lead') blocks[blocks.length - 1] = { t:'intro', lead:prev, kv:b };
    else if(b.t === 'chips' && prev && prev.t === 'intro' && !prev.chips) prev.chips = b;

  const card = (o, j)=>`<button class="cs-card" data-i="${j}" style="--c:${o.color}"><span class="ph"><img src="${cardSrc(o)}" alt="" loading="lazy"></span><b>${o.name}</b><i>${cap(o.kind)}</i></button>`;
  const others = grp => list.map((o, j)=>j !== i && isProduct(o) === grp ? card(o, j) : '').join('');
  $('#caseContent').innerHTML = blocks.map(b=>BLOCKS[b.t](b, c)).join('') + `
    <section class="cs-more reveal">
      <button class="cs-next" data-i="${list.indexOf(nx)}"><img src="${nx.thumb || nx.cover || cardSrc(nx)}" alt="" loading="lazy" style="object-position:${nx.coverPos || 'center'}">
        <span class="tx"><span><small>${L('Следующий проект')}</small><b>${nx.name}</b></span><span class="go">→</span></span></button>
      <h3>${L('Все проекты')}</h3>
      <div class="cs-cards">
        ${others(true) ? `<p class="cs-group">${L('Продуктовый дизайн')}</p>${others(true)}` : ''}
        <p class="cs-group">${L('Коммуникационный дизайн')}</p>${others(false)}
      </div></section>`;
  const cc = $('#caseContent');
  cc.querySelectorAll('.cs-card, .cs-next').forEach(b=>b.addEventListener('click', ()=>switchCase(+b.dataset.i)));
  cc.querySelectorAll('.reveal').forEach(el=>revealIO.observe(el));
  cc.querySelectorAll('[data-live]').forEach(el=>{ liveIO.observe(el); liveRO.observe(el); });
  cc.querySelectorAll('[data-spin]').forEach(spinBox);
  cc.querySelectorAll('.b-ba .cmp').forEach(el=>{
    const set = e=>{ const r = el.getBoundingClientRect(); el.style.setProperty('--p', Math.min(100, Math.max(0, (e.clientX - r.left)/r.width*100)) + '%'); };
    el.addEventListener('pointerenter', e=>{ el.classList.add('man'); set(e); });
    el.addEventListener('pointermove', set);
    el.addEventListener('pointerdown', e=>{ el.classList.add('man'); set(e); });
  });
  cc.querySelectorAll('[data-cycle]').forEach(el=>{
    const ims = [...el.querySelectorAll(':scope > img')], bars = [...el.querySelectorAll('.bars i')]; let k = 0;
    const t = setInterval(()=>{ if(!el.isConnected) return clearInterval(t);
      ims[k].classList.remove('on'); k = (k + 1) % ims.length; ims[k].classList.add('on');
      bars.forEach((b, j)=>b.classList.toggle('on', j <= k)); }, 4000);   // как в Instagram: время рассмотреть «до» и «после»
  });
  cc.querySelectorAll('.deck').forEach(d=>{
    const ims = [...d.querySelectorAll('.stage img')], lab = d.querySelector('.ctl span');

      lab.textContent = `${pad2(k)} / ${String(ims.length).padStart(2, '0')}`; };
    d.querySelectorAll('.ctl button').forEach(b=>b.addEventListener('click', ()=>go(+b.dataset.d)));
    d.querySelector('.stage').addEventListener('click', ()=>go(1));
  });
  caseScroll.scrollTop = 0;
  $('#caseTop').classList.remove('past', 'hide', 'scrolled');
  $('#caseThumbs').innerHTML = thumbsHTML(list);
  $('#caseThumbs').querySelectorAll('.pv-thumb').forEach(b=>{
    const j = +b.dataset.i;
    b.classList.toggle('on', j === i); b.classList.toggle('nb', Math.abs(j - i) === 1);
    b.addEventListener('click', ()=>{ if(j !== openIdx && !list[j].wip) switchCase(j); });
  });
  $('#caseMeta').innerHTML = `<b>${c.name}</b><span>${cap(c.kind)} · ${c.status}</span>`;
  $('#caseBar').classList.remove('on');
  requestAnimationFrame(()=>{ fitTitles($('#case')); caseParallaxReset(); });
  scramble($('#caseLogo'), 'BRUKWA');   // в шапке кейса — логотип, маленький, как на экранах проектов
}
function openCase(i){
  if(openIdx > -1) return;
  openIdx = i;
  fillCase(i);
  caseEl.classList.add('is-open'); caseEl.setAttribute('aria-hidden','false');
  document.body.classList.add('case-on');
  syncHash();
}
// кейс открыт из новой главной (v3.html): закрыть кейс — значит вернуться туда, а не в старую ленту
const FROM_V3 = new URLSearchParams(location.search).get('from') === 'v3';
function closeCase(){
  if(openIdx < 0) return;

  openIdx = -1;
  caseEl.classList.remove('is-open'); caseEl.setAttribute('aria-hidden','true');
  document.body.classList.remove('case-on');
  syncHash();
  setTimeout(()=>{ if(openIdx < 0){ $('#caseCover').innerHTML = ''; $('#caseContent').innerHTML = ''; spins.clear(); } }, 500);
}
// открыть другой кейс поверх текущего; лента под ним тоже переходит на этот проект
function switchCase(j){
  openIdx = j;

  pvBusy = false; pvShow(openIdx, true);

  setTimeout(()=>{ fillCase(openIdx); caseEl.classList.add('is-open'); syncHash(); }, 320);
}
const goNextCase = ()=>switchCase(nextOpen(openIdx));
/* окно «Все работы»: pin — открыли кнопкой (висит, пока не закроют), иначе — выглянуло по наведению на правый край */
const works = $('#works');
let worksPin = false, worksT = 0;
function worksOpen(pin){
  clearTimeout(worksT);
  const list = visible(), cur = openIdx > -1 ? openIdx : pvIdx;
  const card = (o, j, k)=>`<button class="w-card${j === cur ? ' cur' : ''}" data-i="${j}" style="--c:${o.color};--k:${k}">
    <span class="ph" data-here="${L('Вы здесь')}">${o.wip && !o.lock ? lockSVG : `<img src="${cardSrc(o)}" alt="" loading="lazy">`}${o.lock ? `<em class="lk">${lockSVG}</em>` : ''}</span><b>${o.name}</b><i>${cap(o.kind)}${o.lock ? L(' · по запросу') : o.wip ? L(' · в разработке') : ''}</i></button>`;
  let k = 0;
  // по запросу и в разработке — в конце группы
  const rank = o => o.wip && !o.lock ? 2 : o.lock ? 1 : 0;
  const grp = (name, prod)=>{ const cards = [0, 1, 2].map(r => list.map((o, j)=>isProduct(o) === prod && rank(o) === r ? card(o, j, k++) : '').join('')).join('');

  if(!works.classList.contains('on')){

function worksClose(){

$('#worksList').addEventListener('click', e=>{

$('#worksX').addEventListener('click', worksClose);

  works.addEventListener('pointerleave', ()=>{ if(!worksPin) worksT = setTimeout(worksClose, 280); });
}
// шапка кейса: после первого экрана — плашка цвета кейса; листаешь вниз — прячется, вверх — возвращается.

{

/* клик по работе в кейсе — она открывается на весь экран; стрелки листают работы этого блока */
{

    const img = e.target.closest('figure img, .bento > div > img'); if(!img) return;
    const sec = img.closest('section');
    const srcs = [...sec.querySelectorAll('figure img, .bento > div > img')].map(x=>x.currentSrc || x.src);
    open(srcs, srcs.indexOf(img.currentSrc || img.src));
  });
  $('#lboxX').addEventListener('click', close);
  $('#lboxP').addEventListener('click', e=>{ e.stopPropagation(); lboxStep(-1); });
  $('#lboxF').addEventListener('click', e=>{ e.stopPropagation(); lboxStep(1); });
  box.addEventListener('click', e=>{ if(e.target === box) close(); });
}

{

/* ---------- плавный скролл и параллакс в кейсе (как у stephanreds.com: инерция + слои с разной скоростью) ----------
   колесо не прыгает, а доплывает; обложка уезжает медленнее страницы; плитки бенто приезжают
   с отставанием — правые колонки чуть позже левых, а когда плитка на месте, сетка ровная, ничего не обрезается */
let caseParallaxReset = ()=>{};
{
  const smooth = matchMedia('(hover:hover) and (pointer:fine)').matches && !reduceMotion;
  let target = 0, cur = 0, raf = 0, own = 0, tiles = [];
  const max = ()=>caseScroll.scrollHeight - caseScroll.clientHeight;
  // внутри окна сайта, списка и т. п. колесо листает их, а не страницу
  const inner = (el, dy)=>{ for(let n = el; n && n !== caseScroll; n = n.parentElement){
    if(n.scrollHeight > n.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)
      && (dy > 0 ? n.scrollTop + n.clientHeight < n.scrollHeight - 1 : n.scrollTop > 0)) return true; } return false; };
  const tick = ()=>{ cur += (target - cur) * .1; if(Math.abs(target - cur) < .4) cur = target;
    own++; caseScroll.scrollTop = cur; raf = cur !== target ? requestAnimationFrame(tick) : 0; };
  if(smooth) caseScroll.addEventListener('wheel', e=>{
    if(e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY) || inner(e.target, e.deltaY)) return;
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if(!raf) target = cur = caseScroll.scrollTop;
    target = Math.max(0, Math.min(max(), target + d));
    if(!raf) raf = requestAnimationFrame(tick);
  }, { passive:false });
  function parallax(){
    if(reduceMotion) return;
    const vh = innerHeight, y = caseScroll.scrollTop;
    const pic = $('#caseCover .pv-pic'); if(pic) pic.style.translate = `0 ${Math.round(Math.min(y, vh) * .3)}px`;
    for(const o of tiles){
      const top = o.t.getBoundingClientRect().top - o.off;
      if(top > vh * 1.3 || top + o.h < -50){ continue; }
      const k = Math.max(0, Math.min(1, (top - vh * .5) / (vh * .55)));
      const off = Math.round(k * 110 * o.f);
      if(off !== o.off){ o.off = off; o.t.style.translate = off ? `0 ${off}px` : ''; }
    }
  }
  caseScroll.addEventListener('scroll', ()=>{
    if(own) own--; else if(!raf) target = cur = caseScroll.scrollTop;
    parallax();
  }, { passive:true });
  caseParallaxReset = ()=>{
    tiles = [...caseScroll.querySelectorAll('.case-content .bento > div')].map(t=>{
      t.style.translate = ''; const p = t.parentElement.getBoundingClientRect(), r = t.getBoundingClientRect();
      return { t, off:0, h:r.height, f: .45 + (r.left + r.width/2 - p.left) / Math.max(1, p.width) * .9 };
    });
    target = cur = caseScroll.scrollTop; parallax();
  };
  addEventListener('resize', ()=>{ if(openIdx > -1) caseParallaxReset(); });
}

/* ---------- язык и шапка ---------- */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = L('BRUKWA — портфолио');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(el.dataset.ru == null) el.dataset.ru = el.textContent; el.textContent = L(el.dataset.ru); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ if(el.dataset.ruAria == null) el.dataset.ruAria = el.getAttribute('aria-label'); el.setAttribute('aria-label', L(el.dataset.ruAria)); });
  const b = $('#langBtn'); b.querySelectorAll('.lb1').forEach(x=>{ x.textContent = LANG === 'en' ? 'RU' : 'EN'; }); b.setAttribute('aria-label', LANG === 'en' ? 'Русский' : 'English');
}
function setLang(l){
  if(l === LANG) return;
  LANG = l; try { localStorage.setItem('lang', l); } catch(e){}
  buildView(); applyStatic(); worksClose();
  const cur = pvIdx, open = openIdx, y = caseScroll.scrollTop;
  pvIdx = -2; pvBusy = false; renderPreview(cur);
  if(open > -1){ fillCase(open); caseScroll.scrollTop = y; }
}
{
  const hdr = $('#hdr');
  $('#langBtn').addEventListener('click', ()=>setLang(LANG === 'en' ? 'ru' : 'en'));
  hdr.addEventListener('click', e=>{
    const b = e.target.closest('[data-nav]'); if(!b) return;
    const nav = b.dataset.nav;
    if(FROM_V3 && (nav === 'about' || nav === 'work')){ location.href = nav === 'about' ? 'v3.html#about' : 'v3.html'; return; }
    if(nav === 'contact'){ hdr.classList.toggle('pop'); return; }
    hdr.classList.remove('pop');
    if(nav === 'about') goHome();
    if(nav === 'work') worksOpen(true);
  });
  addEventListener('click', e=>{ if(!e.target.closest('#hdr')) hdr.classList.remove('pop'); });
  addEventListener('keydown', e=>{ if(e.key === 'Escape') hdr.classList.remove('pop'); });
  // схема: одна линия от логотипа через все узлы; чёрный отрезок — до активного (или наведённого) раздела.
  // логотип двигается (большой на первом экране, маленький в ленте и кейсе), поэтому линия пересчитывается каждый кадр
  const svgW = $('#hwires'), nodes = [...hdr.querySelectorAll('.hdr-pill button'), hdr.querySelector('.hdr-cv')];
  let hovK = -1, lastKey = '';
  nodes.forEach((n, k)=>{ n.addEventListener('mouseenter', ()=>{ hovK = k; }); n.addEventListener('mouseleave', ()=>{ hovK = -1; }); });
  (function schemaLoop(){
    requestAnimationFrame(schemaLoop);
    if(getComputedStyle(svgW).display === 'none') return;
    const about = openIdx < 0 && pvIdx === -1;
    nodes[0].classList.toggle('on', about); nodes[1].classList.toggle('on', !about);
    const lg = openIdx > -1 ? $('#caseLogo') : logo, lr = lg.getBoundingClientRect();
    const rs = nodes.map(n=>n.getBoundingClientRect());
    const on = about ? 0 : 1, k = hovK > -1 ? hovK : on;
    const key = [lr.right, lr.top, lr.height, ...rs.map(r=>r.left + ',' + r.right + ',' + r.top), k, on].map(v=>typeof v === 'number' ? Math.round(v) : v).join('|');
    if(key === lastKey) return; lastKey = key;
    const y = rs[0].top + rs[0].height / 2, x0 = lr.right + 12, y0 = lr.top + lr.height / 2, end = rs[rs.length - 1].right + 26;
    const a0 = rs[0].left - (on === 0 ? 8 : 0);
    // от логотипа к первому узлу — кривая (логотип бывает выше строки), дальше — прямые промежутки между узлами
    const lead = `M${x0},${y0} C${x0 + (a0 - x0) * .5},${y0} ${x0 + (a0 - x0) * .5},${y} ${a0},${y}`;
    const gaps = rs.slice(1).map((r, j)=>[rs[j].right, r.left]).concat([[rs[rs.length - 1].right, end]]);
    const seg = lim => gaps.filter(([g])=>g < lim).map(([g, b])=>`M${g},${y} L${Math.min(b, lim)},${y}`).join(' ');
    const reach = rs[k].left;
    svgW.innerHTML = `<path d="${lead} ${seg(Infinity)}"/><path class="hot" d="${lead} ${seg(reach)}"/>`
      + rs.map((r, j)=>j === on ? `<circle class="dot" cx="${r.left - 8}" cy="${y}" r="3.2"/><circle class="dot" cx="${r.right + 8}" cy="${y}" r="3.2"/>`
          : `<circle cx="${r.left}" cy="${y}" r="2.4"/><circle cx="${r.right}" cy="${y}" r="2.4"/>`).join('')
      + `<circle class="dot" cx="${x0}" cy="${y0}" r="3.2"/>`;
  })();
  // магнит: кнопка смещается к курсору на 15% расстояния от центра и возвращается на пружине
  if(matchMedia('(hover:hover) and (pointer:fine)').matches && !reduceMotion){
    const mags = [...hdr.querySelectorAll('.mag')].map(el=>({ el, x:0, y:0, vx:0, vy:0, tx:0, ty:0 }));
    let raf = 0, last = 0;
    const step = now=>{ const dt = Math.min(.032, (now - (last || now)) / 1000) || .016; last = now; let moving = false;
      for(const m of mags){ for(const a of ['x', 'y']){ const v = 'v' + a, t = 't' + a;
          const f = 220 * (m[t] - m[a]) - 18 * m[v]; m[v] += f / .3 * dt; m[a] += m[v] * dt;
          if(Math.abs(m[t] - m[a]) > .05 || Math.abs(m[v]) > .05) moving = true; }
        m.el.style.translate = `${m.x.toFixed(2)}px ${m.y.toFixed(2)}px`; }
      raf = moving ? requestAnimationFrame(step) : (last = 0); };
    const kick = ()=>{ if(!raf) raf = requestAnimationFrame(step); };
    for(const m of mags){
      m.el.addEventListener('pointermove', e=>{ const r = m.el.getBoundingClientRect();
        m.tx = (e.clientX - (r.left + r.width/2 - m.x)) * .15; m.ty = (e.clientY - (r.top + r.height/2 - m.y)) * .15; kick(); });
      m.el.addEventListener('pointerleave', ()=>{ m.tx = m.ty = 0; kick(); });
    }
  }
  applyStatic();
}
