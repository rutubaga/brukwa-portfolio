<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRUKWA — портфолио</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@300;400;500&family=Manrope:wght@300;400&family=Onest:wght@300;400&family=Geologica:wght@200;300&family=Golos+Text:wght@400&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root{
    --bg:#ECECEA;
    --ink:#141414;
    --mute:#8A8A86;
    --accent:#2C47F5;
    --radius:44px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --title-font:"Manrope";
    --title-weight:300;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter Tight",system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus,[tabindex]:focus{outline:none}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  a{color:inherit;text-decoration:none}

  /* ---------- шапка ---------- */
  .top{
    position:fixed;inset:0 0 auto 0;z-index:10;
    display:flex;justify-content:center;
    padding:34px 32px 0;
  }

  .logo{
    font-family:Anton,Impact,sans-serif;font-size:clamp(44px,5.4vw,78px);line-height:.9;
    letter-spacing:-.01em;color:var(--ink);
    display:flex;cursor:pointer;user-select:none;
  }
  /* SVG-фильтры включаем только на время эффекта: Safari на iPhone с постоянным фильтром не рисует надпись */
  .logo.wob{filter:url(#wobble)}
  .logo span{display:inline-block;transform-origin:50% 100%}
  .logo.enter span{animation:stretch 1.1s var(--ease) both}
  @keyframes stretch{
    0%{transform:scale(1.9,.05);opacity:0}
    45%{transform:scale(.8,1.3);opacity:1}
    70%{transform:scale(1.08,.92)}
    100%{transform:scale(1,1)}
  }

  /* временный переключатель шрифтов — убрать, когда выберем */
  .fonts{position:fixed;left:20px;bottom:18px;z-index:25;display:flex;padding:3px;border-radius:99px;
    background:rgba(20,20,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px}
  .fonts button{padding:7px 13px;border-radius:99px;color:rgba(255,255,255,.65);transition:background .3s,color .3s}
  .fonts button.is-active{background:#fff;color:#111}
  body:not(.ready) .fonts{opacity:0}

  /* проект в разработке */
  .wip-cover{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
  .wip-cover span{font-family:var(--title-font),"Inter Tight",sans-serif;font-weight:var(--title-weight);
    font-size:clamp(28px,3vw,48px);opacity:.6}

  /* ---------- экран проекта: одно тёмное полотно — слева колонкой надписи, справа на всю высоту обложка ---------- */
  .pv-hero{position:absolute;left:0;top:0;bottom:0;width:40%;z-index:2;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;padding:clamp(84px,12vh,112px) 36px 120px}
  .pv-title{font-family:var(--title-font),"Inter Tight",sans-serif;font-weight:var(--title-weight);
    font-size:clamp(52px,6.4vw,120px);line-height:.94;letter-spacing:-.03em}
  .pv-facts{display:grid;gap:16px;font-size:15px;line-height:1.35;max-width:34ch}
  .pv-facts b{display:block;font-weight:400}
  .pv-facts span{display:block;color:rgba(255,255,255,.5)}
  /* обложка справа на всю высоту, чёткая граница с колонкой надписей */
  .pv-slide:not(.intro) > .pv-pic,.case-cover{left:40%;top:0;right:0;bottom:0}
  .pv-hero > *{opacity:0;transform:translateY(18px);transition:opacity .7s, transform .9s var(--ease)}
  .pv-slide.cur .pv-hero > *{opacity:1;transform:none}
  .pv-slide.cur .pv-hero > :nth-child(2){transition-delay:.12s}

  /* ---------- открытый кейс: тот же верх, ниже подзаголовки и галерея; листается ---------- */
  .case{position:fixed;inset:0;z-index:30;background:#0d0d0e;color:#fff;
    opacity:0;visibility:hidden;transition:opacity .4s, visibility 0s .4s}
  .case.is-open{opacity:1;visibility:visible;transition:opacity .4s}
  .case-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
  .case-first{position:relative;height:100vh}
  .case-cover{position:absolute;overflow:hidden}
  .case .pv-hero > *{opacity:1;transform:none}
  .case-content{padding:110px 36px 120px;display:grid;gap:96px}
  .cs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px;align-items:start}
  .cs h3{font-weight:400;font-size:14px;color:rgba(255,255,255,.5);padding-top:.6em}
  .cs p{font-family:var(--title-font),"Inter Tight",sans-serif;font-weight:var(--title-weight);
    font-size:clamp(22px,2.3vw,38px);line-height:1.22;letter-spacing:-.01em;max-width:28ch}
  .cs-gallery{display:grid;gap:16px}
  .cs-gallery img{display:block;width:100%;border-radius:24px}
  /* в конце кейса — карточки других проектов */
  .cs-more{padding-top:34px;border-top:1px solid rgba(255,255,255,.14)}
  .cs-more h3{font-weight:400;font-size:14px;color:rgba(255,255,255,.5);margin-bottom:22px}
  .cs-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .cs-card{display:block;text-align:left;color:#fff}
  .cs-card .ph{position:relative;display:block;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:var(--c)}
  .cs-card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
  .cs-card .ph svg{position:absolute;inset:0;margin:auto;stroke:var(--ink);opacity:.55}
  .cs-card:hover .ph img{transform:scale(1.04)}
  .cs-card b{display:block;margin-top:14px;font-weight:400;font-family:var(--title-font),"Inter Tight",sans-serif;font-size:clamp(20px,1.8vw,28px)}
  .cs-card i{display:block;margin-top:4px;font-style:normal;font-size:13px;color:rgba(255,255,255,.5)}
  .cs-card.wip{cursor:default}
  /* подзаголовки и блоки проявляются по мере прокрутки */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s, transform 1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .case-top{position:absolute;inset:0 0 auto 0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:16px 36px 0;font-size:13px;pointer-events:none}
  .case-top > *{pointer-events:auto}
  .case-top .logo{color:#fff;font-size:25px}
  .case-top .back{justify-self:start}
  .case-top .next{justify-self:end}
  .case-top button{padding:6px 0;opacity:.85;transition:opacity .3s}
  .case-top button:hover{opacity:1}
  .cta{display:inline-flex;align-items:center;gap:10px;justify-self:start;
    padding:14px 22px;border-radius:99px;background:#fff;color:#111;font-size:14px;font-weight:500}

  /* ---------- надпись у курсора над проектом ---------- */
  .ctag{position:fixed;left:0;top:0;z-index:26;pointer-events:none;padding:14px 22px;border-radius:12px;
    background:rgba(14,17,26,.84);color:#fff;font-size:15px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;
    opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .25s, transform .35s var(--ease)}
  .ctag.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  body.ctag-on .pv-stage{cursor:none}
  @media (hover:none){ .ctag{display:none} }

  /* ---------- контакты на первом экране ---------- */
  .contact{display:inline-flex;align-items:baseline;gap:10px;padding:14px 24px;border-radius:99px;
    background:var(--ink);color:#fff;font-size:clamp(17px,1.4vw,22px);transition:background .3s, transform .4s var(--ease)}
  .contact span{font-size:12px;color:rgba(255,255,255,.55)}
  .contact b{font-weight:400;font-family:var(--title-font),"Inter Tight",sans-serif}
  .contact:hover{background:var(--accent);transform:translateY(-2px)}
  .intro-contacts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

  /* ---------- лента проектов: каждый на весь экран, внизу плашка с миниатюрами ---------- */
  .pv{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:hidden;--gap:12px}
  /* шапка поверх тёмного проекта — белая */
  /* только пока виден сам проект; на светлых «Обо мне» и «Контактах» шапка снова чёрная */
  /* на экранах проектов шапка уменьшается: маленький логотип, тонкая полоска */
  .top .logo{transform-origin:50% 0;transition:transform .7s var(--ease), color .5s}
  body.on-work .top .logo{color:#fff;transform:translateY(-16px) scale(.32)}

  .pv-stage{position:absolute;inset:0;cursor:pointer}
  /* смена проекта как сплошная лента: старый и новый едут вместе, новый прикреплён снизу (или сверху — назад) */
  .pv-slide{position:absolute;inset:0;overflow:hidden;will-change:transform}
  /* проект — во всю ширину и до низа экрана, скруглён только сверху: при смене следующий выезжает снизу скруглённым краем */
  .pv-slide:not(.intro){inset:0;border-radius:var(--radius) var(--radius) 0 0;transition:border-radius .3s var(--ease)}
  /* на странице проекта углы ровные: выпрямляются в самом конце въезда */
  .pv-slide.cur:not(.intro),.pv-slide.flat{border-radius:0}
  /* только сама картинка проекта; фото на первом экране не трогаем */
  .pv-slide > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;
    transform:scale(1.06);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
  .pv-slide.cur > img{transform:scale(1)}
  /* обложка с устройством: картинка, экран и надписи — один слой, двигаются вместе */
  .pv-pic{position:absolute;inset:0;transform:scale(1.06);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
  .pv-slide.cur > .pv-pic{transform:scale(1)}
  .pv-pic > .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  /* CSS-экран ноутбука: тонкая рамка, «чёлка» с камерой, лёгкий блик; внутри — живой сайт */
  .pv-device{position:absolute;overflow:hidden;background:#000;border-radius:var(--dr,10px);
    box-shadow:inset 0 0 0 var(--bz,3px) #0a0a0b}
  .pv-device iframe{position:absolute;left:var(--bz,3px);top:var(--bz,3px);border:0;transform-origin:0 0;background:#0b0d12}
  .pv-device .cam{position:absolute;left:50%;top:0;width:8%;height:2.4%;transform:translateX(-50%);
    background:#0a0a0b;border-radius:0 0 7px 7px;z-index:2}
  .pv-device .glare{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(118deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%)}
  .pv-slide .wip-cover span{font-size:clamp(28px,3vw,48px)}
  /* первый экран — чистая страница «кто я»; работы выезжают снизу по прокрутке */
  .intro-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:28px;padding:140px 20px 90px;color:var(--ink)}
  /* маленькая голова над текстом, без подложки */
  .intro-photo{height:92px}
  .intro-photo img{height:100%;width:auto;display:block}
  .intro-lead{font-family:var(--title-font),"Inter Tight",sans-serif;font-weight:var(--title-weight);
    font-size:clamp(26px,3vw,48px);line-height:1.15;letter-spacing:-.01em;max-width:24ch}
  .intro-go{margin-top:18px;font-size:13px;color:var(--mute);padding:8px 14px;border-radius:99px;
    border:1px solid rgba(20,20,20,.15);animation:bob 2.4s ease-in-out infinite}
  .intro-go:hover{color:var(--ink)}
  @keyframes bob{50%{transform:translateY(5px)}}
  .intro-in > *{opacity:0;filter:blur(14px);transform:translateY(16px);transition:opacity .7s, filter .9s var(--ease), transform .9s var(--ease)}
  .intro-in > .intro-go{transition:opacity .7s .3s, filter .9s .3s var(--ease)}
  .pv-slide.cur .intro-in > *{opacity:1;filter:none;transform:none}
  .pv-slide.cur .intro-in > :nth-child(2){transition-delay:.1s}
  .pv-slide.cur .intro-in > :nth-child(3){transition-delay:.18s}
  .pv-slide.intro{cursor:default}
  /* на первом экране плашки с миниатюрами нет — она выезжает вместе с работами */
  .pv-bar{transition:opacity .6s, transform .8s var(--ease)}
  body.on-intro .pv-bar{opacity:0;transform:translate(-50%,40px);pointer-events:none}
  /* пока внизу временная панель шрифтов — плашка чуть выше, чтобы не наезжать */
  body:has(.fonts) .pv-bar{bottom:72px}
  .pv-bar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:14px;
    padding:8px 8px 8px 8px;border-radius:20px;background:rgba(18,18,18,.86);color:#fff;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
  .pv-bar{transition:opacity .6s, transform .8s var(--ease), padding .5s var(--ease), gap .5s var(--ease), border-radius .5s var(--ease)}
  .pv-thumbs{display:flex;gap:6px;transition:gap .5s var(--ease)}
  /* миниатюра; при наведении на плашку — мини-карточка проекта с подписью */
  .pv-thumb{width:42px;display:flex;flex-direction:column;text-align:left;opacity:.45;
    transition:width .55s var(--ease), opacity .3s, transform .4s var(--ease)}
  .pv-thumb .ph{position:relative;width:100%;height:42px;border-radius:12px;overflow:hidden;background:var(--c);
    transition:height .55s var(--ease), box-shadow .3s}
  .pv-thumb .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pv-thumb .ph svg{position:absolute;inset:0;margin:auto;stroke:var(--ink);opacity:.6}
  .pv-thumb .cap{max-height:0;opacity:0;overflow:hidden;padding:0 2px;transition:max-height .5s var(--ease), opacity .35s, padding .5s var(--ease)}
  .pv-thumb .cap b{display:block;font-weight:400;font-family:var(--title-font),"Inter Tight",sans-serif;font-size:13px;white-space:nowrap}
  .pv-thumb .cap i{display:block;font-style:normal;font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;white-space:nowrap}
  .pv-thumb:hover{opacity:.85}
  .pv-thumb.on{opacity:1;transform:scale(1.04)}
  .pv-thumb.on .ph{box-shadow:0 0 0 2px rgba(18,18,18,1),0 0 0 3.5px rgba(255,255,255,.9)}
  .pv-bar:hover{padding:12px;gap:16px;border-radius:24px}
  .pv-bar:hover .pv-thumbs{gap:10px}
  .pv-bar:hover .pv-thumb{width:150px;opacity:.75;transform:none}
  .pv-bar:hover .pv-thumb:hover,.pv-bar:hover .pv-thumb.on{opacity:1}
  .pv-bar:hover .pv-thumb .ph{height:92px}
  .pv-bar:hover .pv-thumb .cap{max-height:44px;opacity:1;padding:8px 2px 0;transition-delay:0s,.12s,0s}
  /* подпись текущего проекта на это время прячется — подписаны все карточки */
  .pv-meta{transition:max-width .5s var(--ease), opacity .3s, padding .5s var(--ease);max-width:260px}
  .pv-bar:hover .pv-meta{max-width:0;min-width:0 !important;opacity:0;padding:0}
  .pv-meta{min-width:170px;padding-right:6px;overflow:hidden}
  .pv-meta.roll > *{animation:pvroll .7s cubic-bezier(.2,.8,.2,1) both}
  .pv-meta.roll > :nth-child(2){animation-delay:.05s}
  @keyframes pvroll{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
  .pv-meta b{display:block;font-weight:400;font-family:var(--title-font),"Inter Tight",sans-serif;font-size:16px}
  .pv-meta span{display:block;margin-top:2px;font-size:11px;color:rgba(255,255,255,.55)}
  .pv-open{width:42px;height:42px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-size:17px}
  .pv-open svg{stroke:#111}
  /* прогресс — приглушённый, едва заметный */
  .pv-progress{position:absolute;left:14px;right:14px;bottom:3px;height:1.5px;border-radius:2px;background:rgba(255,255,255,.05)}
  .pv-progress b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:rgba(255,255,255,.28)}
  .pv-progress b.run{animation:pvrun var(--pvdur,6s) linear forwards}
  .pv-bar:hover .pv-progress b.run{animation-play-state:paused}
  @keyframes pvrun{to{width:100%}}

  /* ---------- мобильная ---------- */
  @media (max-width:760px){
    :root{--radius:30px}
    .pv-bar{bottom:64px;gap:10px;max-width:calc(100vw - 20px)}
    .pv-thumb{width:34px}
    .pv-thumb .ph,.pv-open{width:34px;height:34px;border-radius:10px}
    .pv-meta{min-width:0}
    .pv-hero{width:auto;right:0;bottom:auto;height:50%;padding:96px 18px 20px}
    .pv-facts{grid-template-columns:1fr 1fr;gap:12px;font-size:12px}
    .pv-facts > :nth-child(3){grid-column:1/-1}
    .pv-slide:not(.intro) > .pv-pic,.case-cover{left:0;top:50%}
    .case-content{padding:70px 18px 90px;gap:64px}
    .cs{grid-template-columns:1fr;gap:12px}
    .case-top{padding:18px 16px 0}
    .top{padding:20px 16px 0}
    .intro-photo{height:76px}
    .intro-in{padding:110px 20px 80px;gap:22px}
    .fonts{left:8px;right:8px;bottom:10px;overflow-x:auto;font-size:11px}
    .fonts button{padding:6px 9px;white-space:nowrap}
    .case-top{padding:18px 16px 0;grid-template-columns:auto 1fr auto}
    .case-top .logo{font-size:22px;justify-self:center}
    body.on-work .top .logo{transform:translateY(-8px) scale(.5)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01s !important;animation-duration:.01s !important}
  }
</style>
</head>
<body>

<!-- «дыхание» логотипа: шум, сила которого анимируется из JS -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap id="wobbleMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="top">
  <div class="logo enter" id="logo" role="button" tabindex="0" aria-label="Все работы"></div>
</header>

<div class="fonts" id="fonts" role="group" aria-label="Шрифт">
  <button data-font="Manrope" data-w="300" style="font-family:Manrope">Manrope</button>
  <button data-font="Onest" data-w="300" style="font-family:Onest">Onest</button>
  <button data-font="Geologica" data-w="200" style="font-family:Geologica">Geologica</button>
  <button data-font="Golos Text" data-w="400" style="font-family:'Golos Text'">Golos</button>
</div>

<!-- лента проектов: каждый на весь экран, новый въезжает снизу; внизу плашка с миниатюрами и прогрессом -->
<section class="pv" id="pv" aria-hidden="true">
  <div class="pv-stage" id="pvStage"></div>
  <div class="pv-bar" id="pvBar">
    <div class="pv-thumbs" id="pvThumbs"></div>
    <div class="pv-meta" id="pvMeta"></div>
    <button class="pv-open" id="pvOpen" aria-label="Открыть кейс"></button>
    <i class="pv-progress"><b id="pvProg"></b></i>
  </div>
</section>

<div class="ctag" id="ctag" aria-hidden="true">Смотреть</div>

<section class="case" id="case" aria-hidden="true">
  <div class="case-scroll" id="caseScroll">
    <div class="case-first">
      <div class="pv-hero"><h1 class="pv-title" id="caseTitle"></h1><div class="pv-facts" id="caseFacts"></div></div>
      <div class="case-cover" id="caseCover"></div>
    </div>
    <div class="case-content" id="caseContent"></div>
  </div>
  <div class="case-top">
    <button class="back" id="back">← Все работы</button>
    <div class="logo" id="caseLogo"></div>
    <button class="next" id="next">Следующий →</button>
  </div>
</section>

<script>
/* Кейсы — в порядке ленты. Тексты черновые. */

const wobbleMap = document.getElementById('wobbleMap');
// Safari и все браузеры на iPhone (WebKit) с SVG-фильтром на тексте могут не нарисовать логотип — там эффекты выключены
const NO_SVG_FX = (()=>{ const ua = navigator.userAgent; return /iP(hone|ad|od)/.test(ua) || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR/.test(ua)); })();
function wobble(from, dur){
  if(NO_SVG_FX) return;
  const t0 = performance.now();
  document.querySelectorAll('.logo').forEach(l=>l.classList.add('wob'));
  (function step(t){
    const k = Math.min(1,(t-t0)/dur);
    wobbleMap.setAttribute('scale', (from*(1-k)*(1-k)*Math.abs(Math.sin(k*9)+.35)).toFixed(2));
    if(k<1) requestAnimationFrame(step);
    else { wobbleMap.setAttribute('scale','0'); document.querySelectorAll('.logo').forEach(l=>l.classList.remove('wob')); }
  })(t0);
}
function scramble(el, text, dur=520){
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const t0 = performance.now();
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), fixed = Math.floor(k*text.length);
    el.textContent = [...text].map((c,i)=> i<fixed||c===' ' ? c : abc[Math.random()*abc.length|0]).join('');
    if(k<1) requestAnimationFrame(step);
  })(t0);
  wobble(26, dur+200);
}

/* ---------- рыбий глаз на логотипе ----------
   Круглая линза ездит за курсором. Внутри радиуса R точка берёт картинку из c + (p − c)·(1 − k·(1 − r²)):
   у центра линзы буквы раздуваются, к её краю искажение плавно сходит на нет.
   Карта линзы рисуется один раз, а при движении мыши сдвигается только её позиция. */
const SVGNS = 'http://www.w3.org/2000/svg';
function fisheye(el, id, k){
  if(NO_SVG_FX) return;
  const svg = document.querySelector('svg');
  const f = document.createElementNS(SVGNS, 'filter');
  f.id = id;
  ['filterUnits','primitiveUnits'].forEach(a=>f.setAttribute(a, 'userSpaceOnUse'));
  f.setAttribute('color-interpolation-filters', 'sRGB');
  // нейтральный серый = «без смещения» везде, где линзы нет
  f.innerHTML = `<feFlood flood-color="rgb(128,128,128)" result="zero"/>
    <feImage preserveAspectRatio="none" result="lens"/>
    <feMerge result="map"><feMergeNode in="zero"/><feMergeNode in="lens"/></feMerge>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>`;
  svg.append(f);
  const m = f.querySelector('feImage'), d = f.querySelector('feDisplacementMap');

  let R = 60, S = 0, amt = 0, goal = 0, mx = 0, my = 0, tx = 0, ty = 0, raf = 0;
  function build(){
    const W = el.offsetWidth, H = el.offsetHeight;
    if(!W || !H) return;
    R = H*1.05;
    const n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(n, n);
    S = 2*R*k*.385 + 2;
    for(let y=0; y<n; y++) for(let x=0; x<n; x++){
      const px = ((x+.5)/n*2 - 1)*R, py = ((y+.5)/n*2 - 1)*R;
      const r2 = (px*px + py*py)/(R*R), g = r2 < 1 ? -k*(1 - r2) : 0, o = (y*n + x)*4;
      img.data[o]   = Math.round((.5 + px*g/S)*255);
      img.data[o+1] = Math.round((.5 + py*g/S)*255);
      img.data[o+2] = 128; img.data[o+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    m.setAttribute('href', cv.toDataURL());
    m.setAttribute('width', R*2); m.setAttribute('height', R*2);
    const pad = Math.round(H*.3);
    f.setAttribute('x', -pad); f.setAttribute('y', -pad);
    f.setAttribute('width', W + pad*2); f.setAttribute('height', H + pad*2);
    place();
  }
  function place(){
    m.setAttribute('x', (mx - R).toFixed(1)); m.setAttribute('y', (my - R).toFixed(1));
    d.setAttribute('scale', (S*amt).toFixed(1));
    el.style.filter = amt > .001 ? `url(#${id}) url(#wobble)` : '';
  }
  // линза догоняет курсор с лёгкой задержкой и плавно появляется / исчезает
  function tick(){
    amt += (goal - amt) * .12;
    mx += (tx - mx) * .25; my += (ty - my) * .25;
    place();
    const still = Math.abs(goal-amt) < .003 && Math.abs(tx-mx) < .2 && Math.abs(ty-my) < .2;
    if(still){ amt = goal; mx = tx; my = ty; place(); raf = 0; }
    else raf = requestAnimationFrame(tick);
  }
  const run = ()=>{ if(!raf) raf = requestAnimationFrame(tick); };
  function aim(e, jump){
    const r = el.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
    if(jump){ mx = tx; my = ty; }
  }
  el.addEventListener('mouseenter', e=>{ aim(e, amt < .05); goal = 1; run(); });
  el.addEventListener('mousemove', e=>{ aim(e); run(); });
  el.addEventListener('mouseleave', ()=>{ goal = 0; run(); });
  new ResizeObserver(build).observe(el);
  build();
}

function pvShow(i, instant, dir){
  const list = visible(), intro = i === -1, c = intro ? null : list[i];
  if((!intro && !c) || i === pvIdx || (pvBusy && !instant)) return;
  const fwd = dir || (i > pvIdx ? 1 : -1);
  pvIdx = i;
  const stage = $('#pvStage');
  const old = stage.querySelector('.pv-slide.cur');
  const sl = document.createElement('div');
  if(intro){
    sl.className = 'pv-slide intro'; sl.style.background = 'var(--bg)';
    sl.innerHTML = introHTML();
    sl.querySelector('[data-go]').addEventListener('click', e=>{ e.stopPropagation(); pvStep(1); });
  } else {
    sl.className = 'pv-slide'; sl.style.background = '#0d0d0e'; sl.dataset.i = i;
    sl.innerHTML = `<div class="pv-hero"><h2 class="pv-title">${c.name}</h2>${factsHTML(c)}</div>${picHTML(c, i)}`;
  }
  if(c && c.device) requestAnimationFrame(()=>placeDevice(sl.querySelector('.pv-pic'), c));
  const theme = ()=>{
    document.body.classList.toggle('on-intro', intro);
    document.body.classList.toggle('on-work', !intro);      // на проектах у шапки — размытая плашка
  };
  if(instant || !old){
    stage.innerHTML = ''; stage.append(sl);
    requestAnimationFrame(()=>requestAnimationFrame(()=>sl.classList.add('cur')));
    theme();
  } else {
    // кинетика: вперёд новый выезжает снизу и накрывает текущий, а текущий проваливается вглубь —
    // чуть вверх, меньше и темнее; картинка в новом едет медленнее карточки и доезжает с запаздыванием.
    // Назад — зеркально: верхний уезжает вниз, лежащий под ним поднимается из глубины.
    pvBusy = true;
    const T = PV_T, E = PV_EASE;
    const DEEP = 'translateY(-6%) scale(.965)', DIM = 'brightness(.72)', LAG = 'translateY(-16%) scale(1.12)';
    const pic = el => el.querySelector(':scope > img, :scope > .pv-pic, :scope > .wip-cover, :scope > .intro-in');
    if(fwd > 0){
      sl.style.transform = 'translateY(100%)';
      if(pic(sl)) pic(sl).style.transform = LAG;
      stage.append(sl); old.classList.add('flat');
    } else {
      sl.classList.add('cur'); sl.style.transform = DEEP; sl.style.filter = DIM;
      stage.insertBefore(sl, old);
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const go = (el, tf, extra = '')=>{ el.style.transition = `transform ${T}ms ${E}, filter ${T}ms ${E}${extra}`; el.style.transform = tf; };
      const picGo = (el, tf)=>{ const im = pic(el); if(im){ im.style.transition = `transform ${T*1.15}ms ${E}`; im.style.transform = tf; } };
      if(fwd > 0){
        go(sl, 'translateY(0)', `, border-radius .45s var(--ease) ${T*.62}ms`); picGo(sl, 'none');
        go(old, DEEP); old.style.filter = DIM;
      } else {
        go(old, 'translateY(100%)', ', border-radius .3s var(--ease)'); picGo(old, LAG);
        go(sl, 'none'); sl.style.filter = 'none';
      }
      old.classList.remove('cur'); sl.classList.add('cur');
    }));
    setTimeout(theme, PV_T * .3);                          // шапка уезжает / возвращается, плашка появляется
    setTimeout(()=>{ old.remove(); pvBusy = false; }, PV_T + 120);
  }
  const pr = $('#pvProg');
  pr.classList.remove('run'); void pr.offsetWidth;
  if(intro) return;                                        // на первом экране автосмены нет
  const meta = $('#pvMeta');
  meta.innerHTML = `<b>${c.name}</b><span>${c.kind[0].toUpperCase() + c.kind.slice(1)} · ${c.status}</span>`;
  meta.classList.remove('roll'); void meta.offsetWidth; meta.classList.add('roll');
  $('#pvOpen').innerHTML = c.wip ? lockSVG : '↗';
  $('#pvThumbs').querySelectorAll('.pv-thumb').forEach(b=>b.classList.toggle('on', +b.dataset.i === i));
  // прогресс внизу плашки; когда дойдёт до конца — следующий проект
  pr.style.setProperty('--pvdur', PV_DUR + 'ms'); pr.classList.add('run');
}

/* экран устройства на обложке: та же математика, что у object-fit: cover — масштаб по большей стороне, центр */
function placeDevice(box0, c){
  const sl = box0;
  const W = sl.clientWidth, H = sl.clientHeight;
  const [iw, ih] = c.device.img, [x, y, w, h] = c.device.rect;
  const k = Math.max(W/iw, H/ih), ox = (W - iw*k)/2, oy = (H - ih*k)/2;
  const box = { left: ox + x*k, top: oy + y*k, width: w*k, height: h*k };
  const dev = sl.querySelector('.pv-device');
  [dev].forEach(el=>Object.assign(el.style, { left: box.left+'px', top: box.top+'px', width: box.width+'px', height: box.height+'px' }));
  // сайт внутри рисуется в ширину 1440 и уменьшается под экран
  const bz = Math.max(2, Math.round(box.width * .006)), inner = box.width - bz*2, vw = 1440;
  dev.style.setProperty('--bz', bz + 'px'); dev.style.setProperty('--dr', Math.round(box.width*.012) + 'px');
  const f = dev.querySelector('iframe');
  f.style.width = vw + 'px'; f.style.height = Math.round((box.height - bz*2) * vw / inner) + 'px';
  f.style.transform = `scale(${inner / vw})`;
}
addEventListener('resize', ()=>{

const pvStep = sg => {
  const n = visible().length;
  if(pvIdx === -1){ if(sg > 0) pvShow(0, false, 1); return; }
  if(pvIdx === 0 && sg < 0) return pvShow(-1, false, -1);
  pvShow((pvIdx + sg + n) % n, false, sg);
};

{

/* ---------- прокрутка, свайпы, клавиши ---------- */
// колесо листает проекты по одному; в открытом кейсе прокрутка вверх возвращает к ленте
let wheelAcc = 0, wheelT = 0, wheelMuteUntil = 0, lastWheel = 0, gestureFromTop = false;
addEventListener('wheel', e=>{
  clearTimeout(wheelT);
  wheelAcc += e.deltaY;
  wheelT = setTimeout(()=>{ wheelAcc = 0; }, 220);
  if(openIdx > -1){
    // закрываем только новым жестом вверх, начатым уже в самом верху: долистала до начала с разгона — кейс остаётся
    const now = performance.now(), fresh = now - lastWheel > 260;
    lastWheel = now;
    if(fresh) gestureFromTop = caseScroll.scrollTop <= 0;
    if(caseScroll.scrollTop > 0) gestureFromTop = false;
    if(!gestureFromTop){ wheelAcc = 0; return; }
    if(wheelAcc < -120){ wheelAcc = 0; closeCase(); wheelMuteUntil = now + 700; }
    return;
  }
  // хвост инерции после закрытия кейса не листает ленту
  if(performance.now() < wheelMuteUntil || pvBusy) return;
  if(Math.abs(wheelAcc) > 60){ pvStep(Math.sign(wheelAcc)); wheelAcc = 0; wheelMuteUntil = performance.now() + PV_T; }
}, { passive:true });
let touchY = null, touchAtTop = false;
addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; touchAtTop = caseScroll.scrollTop <= 0; }, { passive:true });
addEventListener('touchmove', e=>{
  if(touchY === null || openIdx < 0 || !touchAtTop) return;
  // в кейсе свайп вниз тянет его за пальцем; дотянул — закрываем
  const dy = Math.max(0, e.touches[0].clientY - touchY);
  caseEl.style.transition = 'none';
  caseEl.style.transform = `translateY(${(dy*.45).toFixed(1)}px)`;
}, { passive:true });
addEventListener('touchend', e=>{
  if(touchY === null) return;
  const dy = (e.changedTouches[0]?.clientY ?? touchY) - touchY;
  touchY = null;
  if(openIdx > -1){
    caseEl.style.transition = ''; caseEl.style.transform = '';
    if(touchAtTop && dy > 90) closeCase();
    return;
  }
  if(Math.abs(dy) > 60) pvStep(dy < 0 ? 1 : -1);   // свайп вверх — следующий проект
});
addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ closeCase(); return; }
  if(openIdx > -1) return;
  if(e.key === 'ArrowDown' || e.key === 'PageDown') pvStep(1);
  if(e.key === 'ArrowUp' || e.key === 'PageUp') pvStep(-1);
});

// логотип — всегда на главную, к первому экрану: закрывает кейс и возвращает ленту в начало
function goHome(){
  if(openIdx > -1) closeCase();
  if(pvIdx !== -1){ pvBusy = false; pvShow(-1, false, -1); } else wobble(22, 800);
}
logo.addEventListener('click', goHome);
logo.addEventListener('keydown', e=>{ if(e.key==='Enter') goHome(); });
$('#caseLogo').addEventListener('click', goHome);

/* адрес страницы помнит открытый кейс: обновление страницы возвращает туда же */
function syncHash(){
  const h = openIdx > -1 ? 'case/' + visible()[openIdx].id : '';
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}

/* ---------- кейс ---------- */
const caseScroll = $('#caseScroll');
// подзаголовки и блоки проявляются, когда до них долистали
const revealIO = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),
  { root: caseScroll, threshold: .15 });
const nextOpen = i => { const list = visible(); do { i = (i + 1) % list.length; } while(list[i].wip); return i; };
function fillCase(i){
  const c = visible()[i];
  $('#caseTitle').textContent = c.name;
  $('#caseFacts').outerHTML = factsHTML(c).replace('class="pv-facts"', 'class="pv-facts" id="caseFacts"');
  $('#caseCover').innerHTML = picHTML(c, i);
  if(c.device) requestAnimationFrame(()=>placeDevice($('#caseCover .pv-pic'), c));
  const shots = [...(c.slides || []), ...(c.cover && c.img ? [c.img] : [])];
  // тексты пока черновые — из того, что известно о проекте
  $('#caseContent').innerHTML = `
    <section class="cs reveal"><h3>Задача</h3><p>${c.line}</p></section>
    <section class="cs reveal"><h3>Что делала</h3><p>${c.role}</p></section>
    ${shots.length ? `<section class="cs reveal"><h3>Как выглядит</h3><div class="cs-gallery">${shots.map(src=>`<img class="reveal" src="${src}" alt="" loading="lazy">`).join('')}</div></section>` : ''}
    ${c.url ? `<section class="cs reveal"><h3>Посмотреть</h3><a class="cta" href="${c.url}" ${linkAttrs(c)}>${c.urlLabel} ↗</a></section>` : ''}
    <section class="cs-more reveal"><h3>Другие проекты</h3><div class="cs-cards">${
      visible().map((o,j)=>j === i ? '' : `<button class="cs-card${o.wip ? ' wip' : ''}" data-i="${j}" style="--c:${o.color}">
        <span class="ph">${o.wip ? lockSVG : `<img src="${thumbSrc(o)}" alt="" loading="lazy">`}</span>
        <b>${o.name}</b><i>${cap(o.kind)}${o.wip ? ' · в разработке' : ''}</i></button>`).join('')
    }</div></section>`;
  $('#caseContent').querySelectorAll('.cs-card:not(.wip)').forEach(b=>b.addEventListener('click', ()=>switchCase(+b.dataset.i)));
  $('#caseContent').querySelectorAll('.reveal').forEach(el=>revealIO.observe(el));
  caseScroll.scrollTop = 0;
  scramble($('#caseLogo'), 'BRUKWA');   // в шапке кейса — логотип, маленький, как на экранах проектов
}
function openCase(i){
  if(openIdx > -1) return;
  openIdx = i;
  fillCase(i);
  caseEl.classList.add('is-open'); caseEl.setAttribute('aria-hidden','false');
  syncHash();
}
function closeCase(){
  if(openIdx < 0) return;
  openIdx = -1;
  caseEl.classList.remove('is-open'); caseEl.setAttribute('aria-hidden','true');
  syncHash();
}
// открыть другой кейс поверх текущего; лента под ним тоже переходит на этот проект
function switchCase(j){
  openIdx = j;
  // лента под кейсом тоже переходит на этот проект — после закрытия окажемся на нём
  pvBusy = false; pvShow(openIdx, true);
  caseEl.classList.remove('is-open');
  setTimeout(()=>{ fillCase(openIdx); caseEl.classList.add('is-open'); syncHash(); }, 320);
}
const goNextCase = ()=>switchCase(nextOpen(openIdx));
$('#back').addEventListener('click', closeCase);
$('#next').addEventListener('click', goNextCase);

/* ---------- временный выбор шрифта ---------- */
function setFont(b){
  document.documentElement.style.setProperty('--title-font', `"${b.dataset.font}"`);
  document.documentElement.style.setProperty('--title-weight', b.dataset.w);
  document.querySelectorAll('#fonts [data-font]').forEach(x=>x.classList.toggle('is-active', x===b));
  try { localStorage.setItem('brukwa-font', b.dataset.font); } catch(e) {}
}
{
  let saved = null;
  try { saved = localStorage.getItem('brukwa-font'); } catch(e) {}
  const btns = [...document.querySelectorAll('#fonts [data-font]')];
  btns.forEach(b=>b.addEventListener('click', ()=>setFont(b)));
  setFont(btns.find(b=>b.dataset.font===saved) || btns[0]);
}

/* ---------- старт ---------- */
document.fonts.ready.then(()=>{
  wobble(34, 1300);
  fisheye(logo, 'fishLogo', .5);
  fisheye($('#caseLogo'), 'fishCase', .5);
  const h = decodeURIComponent(location.hash.slice(1));
  // кадры проектов грузим и раскодируем заранее, в паузе после старта
  const warm = ()=>CASES.flatMap(c=>[pvSrc(c), c.img]).filter(Boolean).forEach(src=>{ const im = new Image(); im.src = src; im.decode?.().catch(()=>{}); });
  (window.requestIdleCallback || (f=>setTimeout(f, 1500)))(warm);
  const ci = h.startsWith('case/') ? visible().findIndex(c=>c.id === h.slice(5)) : -1;
  setTimeout(()=>{
    document.body.classList.add('ready');
    renderPreview(ci > -1 ? ci : -1);
    if(ci > -1) setTimeout(()=>openCase(ci), 300);
  }, 450);
});
</script>
